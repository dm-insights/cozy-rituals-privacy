<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cozy Rituals — Support</title>
<meta name="description" content="Support for Cozy Rituals, an app for making time for what matters. Get help or send feedback.">
<style>
  :root {
    --shell: #F6F2EC;
    --clay: #E6DFD5;
    --coral: #E07A63;
    --warm-grey: #6B635A;
    --ink: #2A2A2A;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--shell);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  main { max-width: 680px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 400;
    line-height: 1.2;
    font-size: 2.3rem;
    margin: 0 0 8px;
  }
  .doc-title { font-family: Georgia, "Times New Roman", serif; font-size: 1.5rem; margin: 28px 0 0; }
  .tagline { color: var(--warm-grey); margin: 0 0 4px; }
  .summary {
    background: var(--clay);
    border-radius: 18px;
    padding: 22px 24px;
    margin: 28px 0 0;
  }
  .summary p { margin: 0; }
  a { color: var(--ink); text-decoration-color: var(--coral); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  footer { margin-top: 3rem; color: var(--warm-grey); font-size: 0.92rem; }
</style>
</head>
<body>
<main>

<h1>Cozy Rituals</h1>
<p class="tagline">make time for what matters</p>
<p class="doc-title">Support</p>

<div class="summary">
  <p>Need help with Cozy Rituals, found a bug, or just want to share feedback? Email us at <a href="mailto:cozy_rituals@proton.me">cozy_rituals@proton.me</a> and we'll get back to you.</p>
</div>

<footer>
  <p>Cozy Rituals &middot; &copy; 2026 DM Insights</p>
</footer>

</main>
</body>
</html>
